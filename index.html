<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LYRA — AI Shorts & Video Generator</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;600;800&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Plus Jakarta Sans', sans-serif; background: #07090e; color: #f3f4f6; }
        .glass-panel { background: rgba(18, 24, 38, 0.65); backdrop-filter: blur(16px); border: 1px solid rgba(255, 255, 255, 0.08); }
        .btn-gradient { background: linear-gradient(135deg, #6366f1 0%, #a855f7 100%); }
        .btn-gradient:hover { background: linear-gradient(135deg, #4f46e5 0%, #9333ea 100%); }
        
        .shorts-container { position: relative; width: 100%; aspect-ratio: 9/16; overflow: hidden; background: #000; border-radius: 1rem; }
        .shorts-container iframe { position: absolute; top: -50px; left: -20%; width: 140%; height: calc(100% + 100px); pointer-events: none; }
        .mask-overlay { position: absolute; inset: 0; pointer-events: none; }
    </style>
</head>
<body class="min-h-screen flex flex-col justify-between overflow-x-hidden selection:bg-purple-500 selection:text-white">

    <div class="fixed top-0 left-1/4 w-96 h-96 bg-indigo-600/20 rounded-full blur-[120px] pointer-events-none"></div>
    <div class="fixed bottom-0 right-1/4 w-96 h-96 bg-purple-600/20 rounded-full blur-[120px] pointer-events-none"></div>

    <header class="w-full max-w-7xl mx-auto px-6 py-8 flex justify-between items-center z-10">
        <div class="flex items-center space-x-3">
            <div class="w-10 h-10 rounded-xl btn-gradient flex items-center justify-center font-bold text-xl shadow-lg shadow-indigo-500/30">L</div>
            <span class="text-2xl font-extrabold tracking-wider bg-clip-text text-transparent bg-gradient-to-r from-white via-slate-200 to-slate-400">LYRA SHORTS AI</span>
        </div>
        <div class="text-xs uppercase tracking-widest text-slate-400 font-semibold glass-panel px-4 py-2 rounded-full border">
            Engine Built By <span class="text-purple-400 font-bold">Muhammad Taqi</span>
        </div>
    </header>

    <main class="w-full max-w-6xl mx-auto px-6 py-6 flex-1 flex flex-col justify-center items-center z-10">
        <div class="text-center max-w-2xl mb-10">
            <h1 class="text-4xl md:text-6xl font-extrabold tracking-tight mb-4">
                Generate <span class="bg-clip-text text-transparent bg-gradient-to-r from-indigo-400 via-purple-400 to-pink-400">AI Shorts & Videos</span>
            </h1>
            <p class="text-slate-400 text-sm md:text-base">Type prompt to generate vertical AI Shorts in real-time.</p>
        </div>

        <div class="w-full max-w-3xl glass-panel rounded-3xl p-3 md:p-4 mb-12 border border-slate-800 shadow-2xl">
            <form id="searchForm" class="flex flex-col md:flex-row gap-3">
                <input 
                    type="text" 
                    id="promptInput" 
                    placeholder="Type prompt e.g., Cute Boy AI, Cyberpunk Girl..." 
                    class="w-full bg-slate-900/80 text-white placeholder-slate-500 px-6 py-4 rounded-2xl outline-none focus:ring-2 focus:ring-purple-500 border border-slate-800"
                    required
                >
                <button type="submit" id="submitBtn" class="btn-gradient text-white font-bold px-8 py-4 rounded-2xl flex items-center justify-center space-x-2 shrink-0 shadow-lg hover:scale-[1.02] active:scale-95 transition-all">
                    <span id="btnText">Generate AI Short</span>
                    <svg id="loader" class="hidden animate-spin h-5 w-5 text-white" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24">
                        <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle>
                        <path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"></path>
                    </svg>
                </button>
            </form>
        </div>

        <div id="statusMsg" class="hidden text-slate-400 mb-8 text-center text-sm font-medium"></div>
        <div id="resultsGrid" class="w-full grid grid-cols-1 sm:grid-cols-2 md:grid-cols-3 gap-6"></div>
    </main>

    <footer class="w-full max-w-7xl mx-auto px-6 py-8 text-center text-xs text-slate-500 z-10 border-t border-slate-900/60 mt-12">
        LYRA Architecture &copy; Designed & Developed by <strong class="text-slate-300">Muhammad Taqi</strong>.
    </footer>

    <script>
        const searchForm = document.getElementById('searchForm');
        const promptInput = document.getElementById('promptInput');
        const submitBtn = document.getElementById('submitBtn');
        const btnText = document.getElementById('btnText');
        const loader = document.getElementById('loader');
        const resultsGrid = document.getElementById('resultsGrid');
        const statusMsg = document.getElementById('statusMsg');

        searchForm.addEventListener('submit', async (e) => {
            e.preventDefault();
            const prompt = promptInput.value.trim();
            if (!prompt) return;

            submitBtn.disabled = true;
            btnText.textContent = "Rendering AI Short...";
            loader.classList.remove('hidden');
            statusMsg.classList.add('hidden');
            resultsGrid.innerHTML = '';

            try {
                const response = await fetch('/api/search', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ prompt })
                });

                const data = await response.json();
                if (data.success && data.videos.length > 0) {
                    renderVideos(data.videos, prompt);
                } else {
                    showStatus(data.error || 'AI Short render nahi ho saka.');
                }
            } catch (err) {
                showStatus('Connection error. Please try again.');
            } finally {
                submitBtn.disabled = false;
                btnText.textContent = "Generate AI Short";
                loader.classList.add('hidden');
            }
        });

        function renderVideos(videos, userPrompt) {
            resultsGrid.innerHTML = videos.map((vid) => `
                <div class="glass-panel rounded-2xl overflow-hidden border border-slate-800 flex flex-col justify-between group transition-all duration-300 hover:border-purple-500/50 p-3">
                    <div class="shorts-container">
                        <iframe 
                            src="${vid.embed_url}" 
                            allow="autoplay; encrypted-media" 
                            tabindex="-1">
                        </iframe>
                        
                        <div class="mask-overlay flex flex-col justify-between p-3">
                            <div class="flex justify-between items-center z-10">
                                <span class="bg-black/70 backdrop-blur-md text-indigo-400 text-[10px] font-bold px-2.5 py-1 rounded-full border border-indigo-500/30 tracking-wider">
                                    ✦ AI SHORT
                                </span>
                                <span class="bg-black/70 text-emerald-400 text-[9px] font-mono px-2 py-0.5 rounded border border-emerald-500/20">
                                    Rendered
                                </span>
                            </div>

                            <div class="absolute inset-0 flex items-center justify-center pointer-events-none">
                                <div class="w-12 h-12 rounded-full bg-purple-900/50 backdrop-blur-md border border-purple-500/40 flex items-center justify-center text-purple-200 font-extrabold text-sm tracking-tighter opacity-80 shadow-lg">
                                    MT
                                </div>
                            </div>
                        </div>
                    </div>

                    <div class="pt-3 flex flex-col gap-2.5">
                        <p class="text-xs text-slate-300 font-semibold truncate capitalize">Prompt: ${userPrompt}</p>
                        
                        <div class="grid grid-cols-2 gap-2">
                            <a 
                                href="/api/download_yt?id=${vid.video_id}" 
                                class="py-2.5 px-2 btn-gradient text-white text-xs font-bold rounded-xl flex items-center justify-center space-x-1 shadow-md hover:opacity-95 transition-all"
                            >
                                <svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 16v1a3 3 0 003 3h10a3 3 0 003-3v-1m-4-4l-4 4m0 0l-4-4m4 4V4"></path>
                                </svg>
                                <span>Download</span>
                            </a>

                            <button 
                                id="shareBtn-${vid.video_id}"
                                onclick="shareDirectVideo('${userPrompt}', '${vid.video_id}')"
                                class="py-2.5 px-2 bg-slate-800 hover:bg-slate-700 text-white text-xs font-bold rounded-xl flex items-center justify-center space-x-1 border border-slate-700 transition-all"
                            >
                                <svg class="w-3.5 h-3.5 text-purple-400" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8.684 13.342C8.886 12.938 9 12.482 9 12c0-.482-.114-.938-.316-1.342m0 2.684a3 3 0 110-2.684m0 2.684l6.632 3.316m-6.632-6l6.632-3.316m0 0a3 3 0 105.367-2.684 3 3 0 00-5.367 2.684zm0 9.316a3 3 0 105.368 2.684 3 3 0 00-5.368-2.684z"></path>
                                </svg>
                                <span id="shareText-${vid.video_id}">Share Video</span>
                            </button>
                        </div>
                    </div>
                </div>
            `).join('');
        }

        async function shareDirectVideo(prompt, videoId) {
            const shareBtn = document.getElementById(`shareBtn-${videoId}`);
            const shareText = document.getElementById(`shareText-${videoId}`);
            
            const originalText = shareText.textContent;
            shareBtn.disabled = true;
            shareText.textContent = "Preparing Video...";

            try {
                // Fetch video file directly from backend endpoint
                const downloadUrl = `/api/download_yt?id=${videoId}`;
                const response = await fetch(downloadUrl);
                const blob = await response.blob();
                
                const file = new File([blob], `LYRA_AI_${videoId}.mp4`, { type: 'video/mp4' });

                if (navigator.canShare && navigator.canShare({ files: [file] })) {
                    await navigator.share({
                        files: [file],
                        title: `LYRA AI Video — ${prompt}`,
                        text: `AI Video generated for prompt: "${prompt}"`
                    });
                } else {
                    // Fallback for browsers that don't support direct file sharing via Web Share API
                    const tempLink = document.createElement('a');
                    tempLink.href = URL.createObjectURL(blob);
                    tempLink.download = `LYRA_AI_${videoId}.mp4`;
                    tempLink.click();
                    alert("Aapka browser direct file share support nahi karta. Video file download kar di gayi hai!");
                }
            } catch (err) {
                alert("Video file fetch nahi ho saki. Please retry.");
            } finally {
                shareBtn.disabled = false;
                shareText.textContent = originalText;
            }
        }

        function showStatus(msg) {
            statusMsg.textContent = msg;
            statusMsg.classList.remove('hidden');
        }
    </script>
</body>
</html>
