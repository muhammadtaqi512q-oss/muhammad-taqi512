<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LYRA — AI Image Studio</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;600;800&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Plus Jakarta Sans', sans-serif;
            background: #07090e;
            color: #f3f4f6;
        }
        .glass-panel {
            background: rgba(18, 24, 38, 0.65);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid rgba(255, 255, 255, 0.08);
        }
        .glow-effect {
            box-shadow: 0 0 50px -10px rgba(99, 102, 241, 0.25);
        }
        .btn-gradient {
            background: linear-gradient(135deg, #6366f1 0%, #a855f7 100%);
        }
        .btn-gradient:hover {
            background: linear-gradient(135deg, #4f46e5 0%, #9333ea 100%);
        }
    </style>
</head>
<body class="min-h-screen flex flex-col justify-between overflow-x-hidden selection:bg-purple-500 selection:text-white">

    <div class="fixed top-0 left-1/4 w-96 h-96 bg-indigo-600/20 rounded-full blur-[120px] pointer-events-none"></div>
    <div class="fixed bottom-0 right-1/4 w-96 h-96 bg-purple-600/20 rounded-full blur-[120px] pointer-events-none"></div>

    <header class="w-full max-w-7xl mx-auto px-6 py-8 flex justify-between items-center z-10">
        <div class="flex items-center space-x-3">
            <div class="w-10 h-10 rounded-xl btn-gradient flex items-center justify-center font-bold text-xl shadow-lg shadow-indigo-500/30">L</div>
            <span class="text-2xl font-extrabold tracking-wider bg-clip-text text-transparent bg-gradient-to-r from-white via-slate-200 to-slate-400">LYRA</span>
        </div>
        <div class="text-xs uppercase tracking-widest text-slate-400 font-semibold glass-panel px-4 py-2 rounded-full border">
            Created by <span class="text-purple-400 font-bold">Muhammad Taqi</span>
        </div>
    </header>

    <main class="w-full max-w-5xl mx-auto px-6 py-6 flex-1 flex flex-col justify-center items-center z-10">
        <div class="text-center max-w-2xl mb-10">
            <h1 class="text-4xl md:text-6xl font-extrabold tracking-tight mb-4">
                Imagine. Search. <span class="bg-clip-text text-transparent bg-gradient-to-r from-indigo-400 via-purple-400 to-pink-400">Download.</span>
            </h1>
            <p class="text-slate-400 text-sm md:text-base">Ultra-fast public image fetching engine with direct instant downloads.</p>
        </div>

        <div class="w-full glass-panel rounded-3xl p-3 md:p-4 glow-effect mb-12 border border-slate-800">
            <form id="searchForm" class="flex flex-col md:flex-row gap-3">
                <input 
                    type="text" 
                    id="promptInput" 
                    placeholder="Enter image prompt..." 
                    class="w-full bg-slate-900/80 text-white placeholder-slate-500 px-6 py-4 rounded-2xl outline-none focus:ring-2 focus:ring-purple-500 transition-all border border-slate-800/80"
                    required
                >
                <button 
                    type="submit" 
                    id="submitBtn" 
                    class="btn-gradient text-white font-bold px-8 py-4 rounded-2xl transition-all duration-300 flex items-center justify-center space-x-2 shrink-0 shadow-lg hover:scale-[1.02] active:scale-95"
                >
                    <span id="btnText">Generate Image</span>
                    <svg id="loader" class="hidden animate-spin h-5 w-5 text-white" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24">
                        <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle>
                        <path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"></path>
                    </svg>
                </button>
            </form>
        </div>

        <div id="statusMsg" class="hidden text-slate-400 mb-8 text-center text-sm"></div>
        <div id="resultsGrid" class="w-full grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6"></div>
    </main>

    <footer class="w-full max-w-7xl mx-auto px-6 py-8 text-center text-xs text-slate-500 z-10 border-t border-slate-900/60 mt-12">
        LYRA Architecture &copy; Designed & Developed by <strong class="text-slate-300">Muhammad Taqi</strong>.
    </footer>

    <script>
        const searchForm = document.getElementById('searchForm');
        const promptInput = document.getElementById('promptInput');
        const submitBtn = document.getElementById('submitBtn');
        const btnText = document.getElementById('btnText');
        const loader = document.getElementById('loader');
        const resultsGrid = document.getElementById('resultsGrid');
        const statusMsg = document.getElementById('statusMsg');

        searchForm.addEventListener('submit', async (e) => {
            e.preventDefault();
            const prompt = promptInput.value.trim();
            if (!prompt) return;

            submitBtn.disabled = true;
            btnText.textContent = "Fetching...";
            loader.classList.remove('hidden');
            statusMsg.classList.add('hidden');
            resultsGrid.innerHTML = '';

            try {
                const response = await fetch('/api/search', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ prompt })
                });

                const data = await response.json();

                if (data.success && data.images.length > 0) {
                    renderImages(data.images);
                } else {
                    showStatus(data.error || 'No images found.', 'text-red-400');
                }
            } catch (err) {
                showStatus('Network connection error.', 'text-red-400');
            } finally {
                submitBtn.disabled = false;
                btnText.textContent = "Generate Image";
                loader.classList.add('hidden');
            }
        });

        function renderImages(images) {
            resultsGrid.innerHTML = images.map((img) => `
                <div class="glass-panel rounded-2xl overflow-hidden border border-slate-800 flex flex-col justify-between group transition-all duration-300 hover:border-purple-500/50">
                    <div class="relative overflow-hidden aspect-video bg-slate-900">
                        <img 
                            src="${img.url}" 
                            alt="${img.title}" 
                            class="w-full h-full object-cover transition-transform duration-500 group-hover:scale-105"
                            loading="lazy"
                            onerror="this.src='https://via.placeholder.com/600x400/0f172a/64748b?text=Image+Load+Failed'"
                        />
                    </div>
                    <div class="p-4 flex flex-col gap-3">
                        <p class="text-xs text-slate-400 line-clamp-1 font-medium">${img.title || 'Fetched Image'}</p>
                        <a 
                            href="/api/download?url=${encodeURIComponent(img.url)}" 
                            class="w-full py-2.5 px-4 btn-gradient text-white text-xs font-bold rounded-xl flex items-center justify-center space-x-2 shadow-md hover:opacity-95 transition-all"
                        >
                            <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 16v1a3 3 0 003 3h10a3 3 0 003-3v-1m-4-4l-4 4m0 0l-4-4m4 4V4"></path>
                            </svg>
                            <span>Download Image</span>
                        </a>
                    </div>
                </div>
            `).join('');
        }

        function showStatus(msg, colorClass) {
            statusMsg.textContent = msg;
            statusMsg.className = `text-center text-sm ${colorClass} mb-8`;
            statusMsg.classList.remove('hidden');
        }
    </script>
</body>
</html>
