<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LYRA — AI Video Studio</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;600;800&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Plus Jakarta Sans', sans-serif; background: #07090e; color: #f3f4f6; }
        .glass-panel { background: rgba(18, 24, 38, 0.65); backdrop-filter: blur(16px); border: 1px solid rgba(255, 255, 255, 0.08); }
        .btn-gradient { background: linear-gradient(135deg, #6366f1 0%, #a855f7 100%); }
    </style>
</head>
<body class="min-h-screen flex flex-col justify-between overflow-x-hidden">

    <header class="w-full max-w-7xl mx-auto px-6 py-8 flex justify-between items-center z-10">
        <div class="flex items-center space-x-3">
            <div class="w-10 h-10 rounded-xl btn-gradient flex items-center justify-center font-bold text-xl shadow-lg">L</div>
            <span class="text-2xl font-extrabold tracking-wider bg-clip-text text-transparent bg-gradient-to-r from-white to-slate-400">LYRA AI VIDEO</span>
        </div>
        <div class="text-xs uppercase tracking-widest text-slate-400 font-semibold glass-panel px-4 py-2 rounded-full border">
            Created by <span class="text-purple-400 font-bold">Muhammad Taqi</span>
        </div>
    </header>

    <main class="w-full max-w-5xl mx-auto px-6 py-6 flex-1 flex flex-col justify-center items-center z-10">
        <div class="text-center max-w-2xl mb-10">
            <h1 class="text-4xl md:text-6xl font-extrabold tracking-tight mb-4">
                Fetch <span class="bg-clip-text text-transparent bg-gradient-to-r from-indigo-400 via-purple-400 to-pink-400">AI Videos</span>
            </h1>
            <p class="text-slate-400 text-sm">Enter prompt like "Cute Boy", "Cyberpunk Avatar" to fetch playable AI videos.</p>
        </div>

        <div class="w-full glass-panel rounded-3xl p-3 md:p-4 mb-12 border border-slate-800">
            <form id="searchForm" class="flex flex-col md:flex-row gap-3">
                <input 
                    type="text" 
                    id="promptInput" 
                    placeholder="Enter prompt e.g., Cute Boy..." 
                    class="w-full bg-slate-900/80 text-white placeholder-slate-500 px-6 py-4 rounded-2xl outline-none border border-slate-800"
                    required
                >
                <button type="submit" id="submitBtn" class="btn-gradient text-white font-bold px-8 py-4 rounded-2xl flex items-center justify-center space-x-2 shrink-0">
                    <span id="btnText">Fetch AI Video</span>
                </button>
            </form>
        </div>

        <div id="statusMsg" class="hidden text-slate-400 mb-8 text-center text-sm"></div>
        <div id="resultsGrid" class="w-full grid grid-cols-1 md:grid-cols-2 gap-6"></div>
    </main>

    <script>
        const searchForm = document.getElementById('searchForm');
        const promptInput = document.getElementById('promptInput');
        const submitBtn = document.getElementById('submitBtn');
        const btnText = document.getElementById('btnText');
        const resultsGrid = document.getElementById('resultsGrid');
        const statusMsg = document.getElementById('statusMsg');

        searchForm.addEventListener('submit', async (e) => {
            e.preventDefault();
            const prompt = promptInput.value.trim();
            if (!prompt) return;

            submitBtn.disabled = true;
            btnText.textContent = "Fetching AI Video...";
            resultsGrid.innerHTML = '';

            try {
                const response = await fetch('/api/search', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ prompt })
                });

                const data = await response.json();
                if (data.success && data.videos.length > 0) {
                    renderVideos(data.videos);
                } else {
                    showStatus(data.error || 'No videos found.');
                }
            } catch (err) {
                showStatus('Network connection error.');
            } finally {
                submitBtn.disabled = false;
                btnText.textContent = "Fetch AI Video";
            }
        });

        function renderVideos(videos) {
            resultsGrid.innerHTML = videos.map((vid) => `
                <div class="glass-panel rounded-2xl overflow-hidden border border-slate-800 flex flex-col justify-between">
                    <div class="relative overflow-hidden aspect-video bg-black">
                        <video controls autoplay loop muted class="w-full h-full object-cover">
                            <source src="${vid.video_url}" type="video/mp4">
                            Your browser does not support video playback.
                        </video>
                    </div>
                    <div class="p-4 flex flex-col gap-3">
                        <p class="text-xs text-slate-400 font-medium">${vid.title}</p>
                        <a 
                            href="/api/download?url=${encodeURIComponent(vid.video_url)}" 
                            class="w-full py-2.5 px-4 btn-gradient text-white text-xs font-bold rounded-xl flex items-center justify-center space-x-2"
                        >
                            <span>Download AI Video (.MP4)</span>
                        </a>
                    </div>
                </div>
            `).join('');
        }

        function showStatus(msg) {
            statusMsg.textContent = msg;
            statusMsg.classList.remove('hidden');
        }
    </script>
</body>
</html>
