<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LYRA — YouTube AI Video Engine</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;600;800&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Plus Jakarta Sans', sans-serif; background: #07090e; color: #f3f4f6; }
        .glass-panel { background: rgba(18, 24, 38, 0.65); backdrop-filter: blur(16px); border: 1px solid rgba(255, 255, 255, 0.08); }
        .btn-gradient { background: linear-gradient(135deg, #6366f1 0%, #a855f7 100%); }
        .btn-gradient:hover { background: linear-gradient(135deg, #4f46e5 0%, #9333ea 100%); }
    </style>
</head>
<body class="min-h-screen flex flex-col justify-between overflow-x-hidden selection:bg-purple-500 selection:text-white">

    <div class="fixed top-0 left-1/4 w-96 h-96 bg-indigo-600/20 rounded-full blur-[120px] pointer-events-none"></div>
    <div class="fixed bottom-0 right-1/4 w-96 h-96 bg-purple-600/20 rounded-full blur-[120px] pointer-events-none"></div>

    <header class="w-full max-w-7xl mx-auto px-6 py-8 flex justify-between items-center z-10">
        <div class="flex items-center space-x-3">
            <div class="w-10 h-10 rounded-xl btn-gradient flex items-center justify-center font-bold text-xl shadow-lg shadow-indigo-500/30">L</div>
            <span class="text-2xl font-extrabold tracking-wider bg-clip-text text-transparent bg-gradient-to-r from-white via-slate-200 to-slate-400">LYRA YOUTUBE AI</span>
        </div>
        <div class="text-xs uppercase tracking-widest text-slate-400 font-semibold glass-panel px-4 py-2 rounded-full border">
            Created by <span class="text-purple-400 font-bold">Muhammad Taqi</span>
        </div>
    </header>

    <main class="w-full max-w-5xl mx-auto px-6 py-6 flex-1 flex flex-col justify-center items-center z-10">
        <div class="text-center max-w-2xl mb-10">
            <h1 class="text-4xl md:text-6xl font-extrabold tracking-tight mb-4">
                Fetch <span class="bg-clip-text text-transparent bg-gradient-to-r from-indigo-400 via-purple-400 to-pink-400">YouTube AI Videos</span>
            </h1>
            <p class="text-slate-400 text-sm md:text-base">Enter any prompt like "Cute Boy AI" to stream videos instantly.</p>
        </div>

        <div class="w-full glass-panel rounded-3xl p-3 md:p-4 mb-12 border border-slate-800 shadow-2xl">
            <form id="searchForm" class="flex flex-col md:flex-row gap-3">
                <input 
                    type="text" 
                    id="promptInput" 
                    placeholder="Type AI prompt e.g., Cute Boy..." 
                    class="w-full bg-slate-900/80 text-white placeholder-slate-500 px-6 py-4 rounded-2xl outline-none focus:ring-2 focus:ring-purple-500 border border-slate-800"
                    required
                >
                <button type="submit" id="submitBtn" class="btn-gradient text-white font-bold px-8 py-4 rounded-2xl flex items-center justify-center space-x-2 shrink-0 shadow-lg hover:scale-[1.02] active:scale-95 transition-all">
                    <span id="btnText">Search YouTube AI</span>
                    <svg id="loader" class="hidden animate-spin h-5 w-5 text-white" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24">
                        <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle>
                        <path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"></path>
                    </svg>
                </button>
            </form>
        </div>

        <div id="statusMsg" class="hidden text-slate-400 mb-8 text-center text-sm font-medium"></div>
        <div id="resultsGrid" class="w-full grid grid-cols-1 md:grid-cols-2 gap-6"></div>
    </main>

    <footer class="w-full max-w-7xl mx-auto px-6 py-8 text-center text-xs text-slate-500 z-10 border-t border-slate-900/60 mt-12">
        LYRA Architecture &copy; Designed & Developed by <strong class="text-slate-300">Muhammad Taqi</strong>.
    </footer>

    <script>
        const searchForm = document.getElementById('searchForm');
        const promptInput = document.getElementById('promptInput');
        const submitBtn = document.getElementById('submitBtn');
        const btnText = document.getElementById('btnText');
        const loader = document.getElementById('loader');
        const resultsGrid = document.getElementById('resultsGrid');
        const statusMsg = document.getElementById('statusMsg');

        searchForm.addEventListener('submit', async (e) => {
            e.preventDefault();
            const prompt = promptInput.value.trim();
            if (!prompt) return;

            submitBtn.disabled = true;
            btnText.textContent = "Searching YouTube...";
            loader.classList.remove('hidden');
            statusMsg.classList.add('hidden');
            resultsGrid.innerHTML = '';

            try {
                const response = await fetch('/api/search', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ prompt })
                });

                const data = await response.json();
                if (data.success && data.videos.length > 0) {
                    renderVideos(data.videos);
                } else {
                    showStatus(data.error || 'No videos found.');
                }
            } catch (err) {
                showStatus('Network connection error. Try again.');
            } finally {
                submitBtn.disabled = false;
                btnText.textContent = "Search YouTube AI";
                loader.classList.add('hidden');
            }
        });

        function renderVideos(videos) {
            resultsGrid.innerHTML = videos.map((vid) => `
                <div class="glass-panel rounded-2xl overflow-hidden border border-slate-800 flex flex-col justify-between group transition-all duration-300 hover:border-purple-500/50">
                    <div class="relative overflow-hidden aspect-video bg-black">
                        <iframe 
                            src="${vid.embed_url}" 
                            class="w-full h-full border-0" 
                            allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture" 
                            allowfullscreen>
                        </iframe>
                    </div>
                    <div class="p-4 flex flex-col gap-3">
                        <p class="text-xs text-slate-300 font-semibold line-clamp-2">${vid.title}</p>
                        <a 
                            href="${vid.watch_url}" 
                            target="_blank"
                            class="w-full py-3 px-4 btn-gradient text-white text-xs font-bold rounded-xl flex items-center justify-center space-x-2 shadow-md hover:opacity-95 transition-all"
                        >
                            <svg class="w-4 h-4" fill="currentColor" viewBox="0 0 24 24">
                                <path d="M23.498 6.186a3.016 3.016 0 0 0-2.122-2.136C19.505 3.545 12 3.545 12 3.545s-7.505 0-9.377.505A3.017 3.017 0 0 0 .502 6.186C0 8.07 0 12 0 12s0 3.93.502 5.814a3.016 3.016 0 0 0 2.122 2.136c1.871.505 9.376.505 9.376.505s7.505 0 9.377-.505a3.015 3.015 0 0 0 2.122-2.136C24 15.93 24 12 24 12s0-3.93-.502-5.814zM9.545 15.568V8.432L15.818 12l-6.273 3.568z"/>
                            </svg>
                            <span>Watch on YouTube</span>
                        </a>
                    </div>
                </div>
            `).join('');
        }

        function showStatus(msg) {
            statusMsg.textContent = msg;
            statusMsg.classList.remove('hidden');
        }
    </script>
</body>
</html>
